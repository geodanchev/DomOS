# One-time Cloud Build job to create custom users in Cloud SQL
# Run with: gcloud builds submit --config=cloudbuild-create-users.yaml --no-source

steps:
  # Step 1: Build a temporary image with the backend code
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/domos-user-init:latest'
      - '-f'
      - 'Dockerfile.cloudrun'
      - '.'
    dir: 'mvp1-cashier/backend'

  # Step 2: Run the user creation script
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker run --rm \
          -e DATABASE_URL="$$DATABASE_URL" \
          -e GOSH_PASSWORD="$$GOSH_PASSWORD" \
          -e CECKA_PASSWORD="$$CECKA_PASSWORD" \
          -e VIEWER_PASSWORD="$$VIEWER_PASSWORD" \
          gcr.io/$PROJECT_ID/domos-user-init:latest \
          python create_custom_users.py
    secretEnv: ['DATABASE_URL', 'GOSH_PASSWORD', 'CECKA_PASSWORD', 'VIEWER_PASSWORD']

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/domos-database-url/versions/latest
      env: 'DATABASE_URL'
    - versionName: projects/$PROJECT_ID/secrets/domos-gosh-password/versions/latest
      env: 'GOSH_PASSWORD'
    - versionName: projects/$PROJECT_ID/secrets/domos-cecka-password/versions/latest
      env: 'CECKA_PASSWORD'
    - versionName: projects/$PROJECT_ID/secrets/domos-viewer-password/versions/latest
      env: 'VIEWER_PASSWORD'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '300s'
